<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading Screen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 60% 50%, #0a2a4a 0%, #061220 60%, #030b14 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  .scene {
    position: relative;
    /* preenche a tela mantendo proporção 1:1 baseado na menor dimensão */
    width: min(90vw, 90vh);
    height: min(90vw, 90vh);
    max-width: 1200px;
    max-height: 1200px;
  }

  .scene canvas, .scene .base-img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  .base-img {
    object-fit: contain;
    z-index: 0;
  }

  #nodeCanvas {
    z-index: 1;
  }

  /* ── loading bar ── */
  .bar-area {
    z-index: 1;
    margin-top: clamp(16px, 3vh, 40px);
    text-align: center;
  }
  .bar-track {
    width: clamp(180px, 25vw, 360px); height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
    margin: 0 auto;
  }
  .bar-fill {
    height: 100%; width: 40%;
    border-radius: 2px;
    background: linear-gradient(90deg, #005f99, #00d4ff);
    animation: slide 1.8s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
  .bar-text {
    margin-top: 18px;
    color: rgba(255,255,255,0.55);
    font-size: clamp(11px, 1.2vw, 16px);
    letter-spacing: 3px;
    text-transform: uppercase;
    animation: textFade 2.5s ease-in-out infinite;
  }
  @keyframes textFade {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 1; }
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <img
    class="base-img"
    src="https://static.moxtcontent.com/public/resource/ai/gen/cc2d608c-caec-4a4b-ac60-2303e734a86d.jpg"
    alt="Loading"
  />
  <canvas id="nodeCanvas"></canvas>
</div>

<div class="bar-area">
  <div class="bar-track"><div class="bar-fill"></div></div>
  <div class="bar-text">Carregando</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('nodeCanvas');
  const ctx = canvas.getContext('2d');
  const sceneEl = document.getElementById('scene');

  // ── Responsive sizing with high-DPI ──
  // All node coordinates are authored in a 400×400 "design space".
  // We scale them at render time so the canvas is always crisp.
  const DESIGN = 400;
  let S = 1; // current scale factor (design → CSS px)

  function resize() {
    const rect = sceneEl.getBoundingClientRect();
    const css  = rect.width;               // CSS px of the scene box
    const dpr  = window.devicePixelRatio || 1;

    canvas.width  = css * dpr;
    canvas.height = css * dpr;

    ctx.setTransform(1, 0, 0, 1, 0, 0);   // reset
    S = (css / DESIGN) * dpr;
    ctx.scale(S, S);                       // everything drawn in 400-space
  }
  resize();
  window.addEventListener('resize', resize);

  // ── Anchor points (400×400 design space) ──
  const anchorPoints = [
    // main large nodes
    { x: 175, y: 155, r: 6,   hub: true  },
    { x: 130, y: 130, r: 5,   hub: true  },
    { x: 145, y: 195, r: 5.5, hub: true  },
    { x: 195, y: 120, r: 4.5, hub: false },
    { x: 110, y: 175, r: 5,   hub: true  },

    // medium nodes
    { x: 155, y: 108, r: 4,   hub: false },
    { x: 100, y: 145, r: 4,   hub: false },
    { x: 120, y: 205, r: 3.5, hub: false },
    { x: 165, y: 225, r: 3.5, hub: false },
    { x: 200, y: 175, r: 3.5, hub: false },
    { x: 85,  y: 120, r: 3,   hub: false },

    // small floating dots
    { x: 72,  y: 155, r: 2.5, hub: false },
    { x: 90,  y: 100, r: 2,   hub: false },
    { x: 65,  y: 130, r: 2,   hub: false },
    { x: 78,  y: 185, r: 2.5, hub: false },
    { x: 105, y: 225, r: 2,   hub: false },
    { x: 55,  y: 160, r: 1.8, hub: false },
    { x: 135, y: 240, r: 2,   hub: false },
    { x: 210, y: 145, r: 2,   hub: false },
    { x: 60,  y: 105, r: 1.5, hub: false },
  ];

  // ── Animated nodes ──
  class Node {
    constructor(anchor) {
      this.anchor = anchor;
      this.x = anchor.x;
      this.y = anchor.y;
      this.r = anchor.r;
      this.hub = anchor.hub;
      this.wanderRange = anchor.hub ? 8 : 18;
      this.targetX = anchor.x;
      this.targetY = anchor.y;
      this.pickNewTarget();
      this.pulsePhase = Math.random() * Math.PI * 2;
      this.pulseSpeed = 0.02 + Math.random() * 0.02;
    }

    pickNewTarget() {
      const a = Math.random() * Math.PI * 2;
      const d = Math.random() * this.wanderRange;
      this.targetX = this.anchor.x + Math.cos(a) * d;
      this.targetY = this.anchor.y + Math.sin(a) * d;
      this.moveSpeed = 0.008 + Math.random() * 0.012;
    }

    update() {
      this.x += (this.targetX - this.x) * this.moveSpeed;
      this.y += (this.targetY - this.y) * this.moveSpeed;
      const dx = this.targetX - this.x, dy = this.targetY - this.y;
      if (Math.sqrt(dx * dx + dy * dy) < 1) this.pickNewTarget();
      this.pulsePhase += this.pulseSpeed;
    }

    opacity() { return 0.6 + 0.4 * Math.sin(this.pulsePhase); }
    radius()  { return this.r * (1 + 0.15 * Math.sin(this.pulsePhase)); }
  }

  const nodes = anchorPoints.map(a => new Node(a));

  // ── Connections ──
  class Connection {
    constructor(a, b) {
      this.a = a; this.b = b;
      this.life = 0;
      this.maxLife = 200 + Math.random() * 300;
      this.state = 'forming';
      this.formDur = 40 + Math.random() * 30;
      this.relDur  = 50 + Math.random() * 30;
      this.alive = true;
      this.sigT = -1;
      this.sigSpd = 0.012 + Math.random() * 0.015;
      this.sigDelay = 30 + Math.random() * 80;
      this.sigTimer = this.sigDelay;
    }

    update() {
      this.life++;
      if (this.state === 'forming' && this.life > this.formDur)  this.state = 'active';
      if (this.state === 'active'  && this.life > this.maxLife - this.relDur) this.state = 'releasing';
      if (this.life > this.maxLife) { this.alive = false; return; }

      if (this.state === 'active') {
        this.sigTimer--;
        if (this.sigTimer <= 0 && this.sigT < 0) this.sigT = 0;
        if (this.sigT >= 0) {
          this.sigT += this.sigSpd;
          if (this.sigT > 1) { this.sigT = -1; this.sigTimer = this.sigDelay; }
        }
      }
    }

    alpha() {
      if (this.state === 'forming')   return (this.life / this.formDur) * 0.6;
      if (this.state === 'active')    return 0.6;
      if (this.state === 'releasing') {
        const p = (this.life - (this.maxLife - this.relDur)) / this.relDur;
        return (1 - p) * 0.6;
      }
      return 0;
    }

    draw(ctx) {
      const al = this.alpha();
      if (al < 0.01) return;
      const ax = this.a.x, ay = this.a.y, bx = this.b.x, by = this.b.y;

      // main line
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
      ctx.strokeStyle = `rgba(0,195,255,${al * 0.7})`; ctx.lineWidth = 1.2; ctx.stroke();

      // glow
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
      ctx.strokeStyle = `rgba(0,180,255,${al * 0.2})`; ctx.lineWidth = 4; ctx.stroke();

      // traveling signal
      if (this.sigT >= 0 && this.sigT <= 1) {
        const sx = ax + (bx - ax) * this.sigT;
        const sy = ay + (by - ay) * this.sigT;
        const sa = Math.sin(this.sigT * Math.PI);

        ctx.beginPath(); ctx.arc(sx, sy, 3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180,240,255,${sa * 0.95})`; ctx.fill();

        ctx.beginPath(); ctx.arc(sx, sy, 9, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0,210,255,${sa * 0.3})`; ctx.fill();
      }
    }
  }

  let connections = [];
  let connTimer = 0;

  function spawnConnection() {
    for (let t = 0; t < 15; t++) {
      const a = nodes[Math.floor(Math.random() * nodes.length)];
      const b = nodes[Math.floor(Math.random() * nodes.length)];
      if (a === b) continue;
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d > 120 || d < 15) continue;
      if (connections.some(c => c.alive && ((c.a===a&&c.b===b)||(c.a===b&&c.b===a)))) continue;
      connections.push(new Connection(a, b));
      return;
    }
  }
  for (let i = 0; i < 8; i++) spawnConnection();

  // ── Render ──
  function frame() {
    // clear in design coords
    ctx.clearRect(0, 0, DESIGN, DESIGN);

    for (const n of nodes) n.update();

    connTimer++;
    if (connTimer > 25) { connTimer = 0; if (connections.filter(c=>c.alive).length < 12) spawnConnection(); }

    connections = connections.filter(c => c.alive);
    for (const c of connections) { c.update(); c.draw(ctx); }

    for (const n of nodes) {
      const op = n.opacity(), r = n.radius();

      // outer glow
      const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 4);
      g.addColorStop(0, `rgba(0,190,255,${op*0.2})`);
      g.addColorStop(1, `rgba(0,190,255,0)`);
      ctx.beginPath(); ctx.arc(n.x, n.y, r*4, 0, Math.PI*2);
      ctx.fillStyle = g; ctx.fill();

      // core
      ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI*2);
      const cg = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r);
      cg.addColorStop(0,   `rgba(180,240,255,${op*0.95})`);
      cg.addColorStop(0.5, `rgba(0,200,255,${op*0.9})`);
      cg.addColorStop(1,   `rgba(0,160,255,${op*0.7})`);
      ctx.fillStyle = cg; ctx.fill();
    }

    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
