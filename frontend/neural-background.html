<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Background</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: radial-gradient(ellipse at 55% 45%, #0a2a4a 0%, #061220 55%, #030b14 100%);
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // ── Nodes ──
  const NODE_COUNT = 70;
  const CONNECT_DIST = 180;

  class Node {
    constructor() { this.spawn(); this.life = Math.random() * this.maxLife; }

    spawn() {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.r = 1.5 + Math.random() * 4;
      this.hub = this.r > 4;

      // pick a wander target
      this.targetX = this.x;
      this.targetY = this.y;
      this.pickTarget();

      this.maxLife = 500 + Math.random() * 600;
      this.life = 0;
      this.pulsePhase = Math.random() * Math.PI * 2;
      this.pulseSpeed = 0.015 + Math.random() * 0.02;
    }

    pickTarget() {
      const range = this.hub ? 30 : 60;
      const angle = Math.random() * Math.PI * 2;
      const dist  = Math.random() * range;
      this.targetX = this.x + Math.cos(angle) * dist;
      this.targetY = this.y + Math.sin(angle) * dist;
      // keep in bounds
      this.targetX = Math.max(0, Math.min(W, this.targetX));
      this.targetY = Math.max(0, Math.min(H, this.targetY));
      this.speed = 0.005 + Math.random() * 0.01;
    }

    update() {
      this.x += (this.targetX - this.x) * this.speed;
      this.y += (this.targetY - this.y) * this.speed;

      if (Math.hypot(this.targetX - this.x, this.targetY - this.y) < 2) {
        this.pickTarget();
      }

      this.life++;
      this.pulsePhase += this.pulseSpeed;

      if (this.life > this.maxLife) this.spawn();
    }

    opacity() {
      const fadeIn  = Math.min(this.life / 80, 1);
      const fadeOut = Math.min((this.maxLife - this.life) / 80, 1);
      const pulse  = 0.55 + 0.45 * Math.sin(this.pulsePhase);
      return fadeIn * fadeOut * pulse;
    }

    radius() {
      return this.r * (1 + 0.12 * Math.sin(this.pulsePhase));
    }
  }

  const nodes = Array.from({ length: NODE_COUNT }, () => new Node());

  // ── Connections ──
  class Connection {
    constructor(a, b) {
      this.a = a; this.b = b;
      this.life = 0;
      this.maxLife = 180 + Math.random() * 280;
      this.state = 'forming';
      this.formDur = 35 + Math.random() * 25;
      this.relDur  = 45 + Math.random() * 25;
      this.alive = true;

      // signal
      this.sigT = -1;
      this.sigSpd = 0.01 + Math.random() * 0.018;
      this.sigDelay = 40 + Math.random() * 100;
      this.sigTimer = this.sigDelay;
    }

    update() {
      this.life++;
      if (this.state === 'forming' && this.life > this.formDur) this.state = 'active';
      if (this.state === 'active' && this.life > this.maxLife - this.relDur) this.state = 'releasing';
      if (this.life > this.maxLife) { this.alive = false; return; }

      if (this.state === 'active') {
        this.sigTimer--;
        if (this.sigTimer <= 0 && this.sigT < 0) this.sigT = 0;
        if (this.sigT >= 0) {
          this.sigT += this.sigSpd;
          if (this.sigT > 1) { this.sigT = -1; this.sigTimer = this.sigDelay; }
        }
      }
    }

    alpha() {
      if (this.state === 'forming') return (this.life / this.formDur) * 0.5;
      if (this.state === 'active')  return 0.5;
      if (this.state === 'releasing') {
        return (1 - (this.life - (this.maxLife - this.relDur)) / this.relDur) * 0.5;
      }
      return 0;
    }

    draw() {
      const al = this.alpha();
      if (al < 0.01) return;

      const ax = this.a.x, ay = this.a.y, bx = this.b.x, by = this.b.y;

      // main line
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
      ctx.strokeStyle = `rgba(0,195,255,${al * 0.6})`;
      ctx.lineWidth = 1; ctx.stroke();

      // glow line
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
      ctx.strokeStyle = `rgba(0,180,255,${al * 0.15})`;
      ctx.lineWidth = 3.5; ctx.stroke();

      // traveling signal
      if (this.sigT >= 0 && this.sigT <= 1) {
        const sx = ax + (bx - ax) * this.sigT;
        const sy = ay + (by - ay) * this.sigT;
        const sa = Math.sin(this.sigT * Math.PI);

        ctx.beginPath(); ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180,240,255,${sa * 0.9})`; ctx.fill();

        ctx.beginPath(); ctx.arc(sx, sy, 8, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0,210,255,${sa * 0.2})`; ctx.fill();
      }
    }
  }

  let connections = [];
  let connTimer = 0;

  function spawnConnection() {
    for (let t = 0; t < 20; t++) {
      const a = nodes[Math.floor(Math.random() * nodes.length)];
      const b = nodes[Math.floor(Math.random() * nodes.length)];
      if (a === b) continue;
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d > CONNECT_DIST || d < 20) continue;
      if (connections.some(c => c.alive && ((c.a===a&&c.b===b)||(c.a===b&&c.b===a)))) continue;
      connections.push(new Connection(a, b));
      return;
    }
  }

  // seed initial connections
  for (let i = 0; i < 15; i++) spawnConnection();

  // ── Render loop ──
  function frame() {
    ctx.clearRect(0, 0, W, H);

    // update nodes
    for (const n of nodes) n.update();

    // spawn connections
    connTimer++;
    if (connTimer > 18) {
      connTimer = 0;
      if (connections.filter(c => c.alive).length < 25) spawnConnection();
    }

    // draw connections
    connections = connections.filter(c => c.alive);
    for (const c of connections) { c.update(); c.draw(); }

    // draw nodes
    for (const n of nodes) {
      const op = n.opacity();
      const r  = n.radius();
      if (op < 0.01) continue;

      // outer glow
      const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 4);
      g.addColorStop(0, `rgba(0,190,255,${op * 0.18})`);
      g.addColorStop(1, `rgba(0,190,255,0)`);
      ctx.beginPath(); ctx.arc(n.x, n.y, r * 4, 0, Math.PI * 2);
      ctx.fillStyle = g; ctx.fill();

      // core
      const cg = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r);
      cg.addColorStop(0,   `rgba(180,240,255,${op * 0.9})`);
      cg.addColorStop(0.5, `rgba(0,200,255,${op * 0.85})`);
      cg.addColorStop(1,   `rgba(0,150,255,${op * 0.6})`);
      ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fillStyle = cg; ctx.fill();
    }

    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
